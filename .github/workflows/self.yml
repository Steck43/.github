name: self

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    name: checks (tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --disable-pip-version-check "pytest==8.4.2"
          python -m pytest -q checks/tests
          python -I checks/voice_lint.py --selftest
          bash -n checks/prepush.sh

  house:
    name: house
    uses: ./.github/workflows/house-checks.yml
    with:
      checks-ref: ${{ github.event.pull_request.head.sha || github.sha }}
